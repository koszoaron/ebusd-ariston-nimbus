[project]
name = "ebusnimbus"
version = "0.1.0"
description = "Capture, parse and census tooling for Ariston Nimbus eBUS (Bridgenet) traffic"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest"]
cloud = ["ariston==0.19.9"]

[project.scripts]
ebus-capture = "ebusnimbus.capture:main"
ebus-sidechannel = "ebusnimbus.sidechannel:main"
ebus-census = "ebusnimbus.census:main"
ebus-replay = "ebusnimbus.replay:main"
ebus-series = "ebusnimbus.series:main"
ebus-cloud = "ebusnimbus.cloud:main"
ebus-cycles = "ebusnimbus.cycles:main"
ebus-updates = "ebusnimbus.updates:main"
ebus-hasim = "ebusnimbus.hasim:main"
ebus-mqttacl = "ebusnimbus.mqttacl:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
